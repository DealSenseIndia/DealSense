name: DealSense store refresh

# Reads a couple of store pages directly, on top of the provider sync that
# runs every 20 minutes (see sync.yml). This is the step that proves a price
# on the store itself rather than trusting the feed, so it stays deliberately
# small: two pages an hour is enough to catch drift without inviting blocks.
#
# Repository secrets: DEALSENSE_URL (e.g. https://dealsense.in) and CRON_SECRET.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: dealsense-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read store pages directly
        run: |
          curl -fsS --max-time 120 --retry 2 --retry-delay 10 \
            "${{ secrets.DEALSENSE_URL }}/api/cron/refresh?limit=2&secret=${{ secrets.CRON_SECRET }}"
